version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always

    ports:
      - "${SPRING_DATABASE_PORT}:5432"

    environment:
      POSTGRES_DB: ${SPRING_DATABASE_NAME}
      POSTGRES_USER: ${SPRING_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: